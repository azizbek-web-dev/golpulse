<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <!-- Variant 1 — Geometrik minimal: to'p panelidan yasalgan qalin G -->
  <g transform="translate(8,8)">
    <!-- G halqa segmenti (o'ngda oraliq) -->
    <path d="M 51.9 15.3 A 26 26 0 1 0 51.9 48.7 L 43.5 41.6 A 15 15 0 1 1 43.5 22.4 Z" fill="#EDF1F5"/>
    <!-- G ning gorizontal spur + pastki tiki -->
    <path d="M30 28.5 H54 V35.5 H30 Z" fill="#EDF1F5"/>
    <path d="M47 35.5 H54 V45 H47 Z" fill="#EDF1F5"/>
    <!-- Panel choklari (fon rangida kesilgan) -->
    <g stroke="#0E1116" stroke-width="2.4">
      <line x1="35.8" y1="26.7" x2="46.1" y2="12.6"/>
      <line x1="38.2" y1="33.9" x2="54.8" y2="39.4"/>
      <line x1="32" y1="38.5" x2="32" y2="56"/>
      <line x1="25.8" y1="33.9" x2="9.2" y2="39.4"/>
      <line x1="28.2" y1="26.7" x2="17.9" y2="12.6"/>
    </g>
    <!-- Markaziy beshburchak panel -->
    <polygon points="35.8,26.7 38.2,33.9 32,38.5 25.8,33.9 28.2,26.7" fill="#0E1116"/>
  </g>
  <text x="92" y="51" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="800" letter-spacing="2.5"><tspan fill="#EDF1F5">GOL</tspan><tspan fill="#00D26A">PULSE</tspan></text>
</svg>
